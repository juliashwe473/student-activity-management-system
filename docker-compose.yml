services:
  mongo:
    image: mongo:7
    container_name: student-activity-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - student-network

  backend:
    build: ./backend
    container_name: student-activity-backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-5000}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/student_activity_db}
      JWT_SECRET: ${JWT_SECRET:-student-activity-dev-secret-change-this}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:4200}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@studentactivity.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    networks:
      - student-network

  frontend:
    build: ./frontend
    container_name: student-activity-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - student-network

volumes:
  mongo_data:

networks:
  student-network:
    driver: bridge
